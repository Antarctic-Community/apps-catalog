name: Validate PR
on:
  pull_request:
    paths: ['apps/**', 'collections.json', 'categories.json', 'schema/**', 'scripts/**', 'src/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # запасная дата «Новых», если API ещё не отдаёт createdAt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate app.json, images and collections
        run: npm run validate
      - name: Build site
        run: npm run build
